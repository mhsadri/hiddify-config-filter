name: Update Hiddify Configs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source configs
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt" \
            -o source.txt

      - name: Filter configs
        run: |
          python3 <<'PY'
          from urllib.parse import (
              urlsplit,
              urlunsplit,
              parse_qsl,
              urlencode,
              unquote,
          )

          SOURCE = "source.txt"
          OUTPUT = "proxy_configs.txt"

          valid_packet_encoding = {
              "",
              "xudp",
              "packetaddr",
          }

          valid_vless_flow = {
              "",
              "xtls-rprx-vision",
          }

          kept = 0
          removed = 0

          with open(
              SOURCE,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as src, open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as out:

              for raw in src:
                  line = raw.rstrip("\r\n")

                  # Keep empty lines and comments.
                  if not line or line.startswith("#") or line.startswith("//"):
                      out.write(raw)
                      continue

                  # Ignore lines that are not proxy URLs.
                  if "://" not in line:
                      out.write(raw)
                      continue

                  try:
                      parts = urlsplit(line)
                      scheme = parts.scheme.lower()

                      # --------------------------------------------------
                      # IMPORTANT:
                      # Hiddify requires every imported proxy profile
                      # to have a non-empty name.
                      #
                      # Therefore:
                      #   vless://...#name       -> KEEP
                      #   vless://...             -> REMOVE
                      #   vless://...#            -> REMOVE
                      #   vless://...#%20         -> REMOVE
                      # --------------------------------------------------

                      fragment_name = unquote(parts.fragment).strip()

                      if not fragment_name:
                          removed += 1
                          continue

                      # Only VLESS needs the strict parameter checks.
                      if scheme != "vless":
                          out.write(raw)
                          kept += 1
                          continue

                      query = parse_qsl(
                          parts.query,
                          keep_blank_values=True
                      )

                      new_query = []
                      bad = False

                      for key, value in query:
                          key_lower = key.lower()
                          value_lower = value.lower()

                          # ----------------------------------------------
                          # packetEncoding / packet_encoding
                          # ----------------------------------------------
                          if key_lower in {
                              "packetencoding",
                              "packet_encoding"
                          }:

                              # "none" has caused problems with some
                              # sing-box / Hiddify versions.
                              if value_lower == "none":
                                  # Remove it completely.
                                  continue

                              if value_lower not in valid_packet_encoding:
                                  bad = True
                                  break

                          # ----------------------------------------------
                          # VLESS flow
                          # ----------------------------------------------
                          if key_lower == "flow":
                              if value_lower not in valid_vless_flow:
                                  bad = True
                                  break

                          new_query.append((key, value))

                      if bad:
                          removed += 1
                          continue

                      rebuilt = urlunsplit((
                          parts.scheme,
                          parts.netloc,
                          parts.path,
                          urlencode(new_query, doseq=True),
                          parts.fragment
                      ))

                      out.write(rebuilt + "\n")
                      kept += 1

                  except Exception:
                      # Never put a malformed proxy URL into Hiddify.
                      removed += 1

          print(f"Kept: {kept}")
          print(f"Removed: {removed}")
          PY

          rm -f source.txt

      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Commit filtered configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proxy_configs.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update filtered proxy configs"
          fi

      - name: Push changes
        run: |
          git push origin HEAD:main
