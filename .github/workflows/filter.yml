name: Update Hiddify Configs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source configs
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt" \
            -o source.txt

      - name: Filter configs
        run: |
          python3 <<'PY'
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode

          SOURCE = "source.txt"
          OUTPUT = "proxy_configs.txt"

          valid_packet_encoding = {"", "xudp", "packetaddr"}
          valid_vless_flow = {"", "xtls-rprx-vision"}

          kept = 0
          removed = 0

          with open(SOURCE, "r", encoding="utf-8", errors="ignore") as src, \
               open(OUTPUT, "w", encoding="utf-8") as out:

              for raw in src:
                  line = raw.rstrip("\n")

                  # Keep subscription metadata/comments/empty lines
                  if not line or line.startswith("#") or line.startswith("//"):
                      out.write(raw)
                      continue

                  # Only inspect actual proxy URLs
                  if "://" not in line:
                      out.write(raw)
                      continue

                  try:
                      # Separate the URI from the display name after #
                      # We need to preserve the fragment/name.
                      parts = urlsplit(line)

                      scheme = parts.scheme.lower()

                      # Only VLESS needs the strict checks responsible
                      # for the known sing-box crash.
                      if scheme != "vless":
                          out.write(raw)
                          kept += 1
                          continue

                      query = parse_qsl(
                          parts.query,
                          keep_blank_values=True
                      )

                      new_query = []
                      bad = False

                      for key, value in query:
                          key_lower = key.lower()
                          value_lower = value.lower()

                          # packetEncoding / packet_encoding
                          if key_lower in {
                              "packetencoding",
                              "packet_encoding"
                          }:
                              # "none" is dangerous for affected
                              # sing-box/Hiddify versions.
                              if value_lower == "none":
                                  # Omit the parameter completely.
                                  # This is equivalent to not specifying it
                                  # and avoids the known panic.
                                  continue

                              if value_lower not in valid_packet_encoding:
                                  bad = True
                                  break

                          # VLESS flow
                          if key_lower == "flow":
                              if value_lower not in valid_vless_flow:
                                  bad = True
                                  break

                          new_query.append((key, value))

                      if bad:
                          removed += 1
                          continue

                      rebuilt = urlunsplit((
                          parts.scheme,
                          parts.netloc,
                          parts.path,
                          urlencode(new_query, doseq=True),
                          parts.fragment
                      ))

                      # Empty fragment means an incomplete name.
                      # Drop it only when the URI actually ends with #.
                      if line.endswith("#"):
                          removed += 1
                          continue

                      out.write(rebuilt + "\n")
                      kept += 1

                  except Exception:
                      # If a line cannot be parsed safely, don't feed it
                      # to Hiddify.
                      removed += 1

          print(f"Kept: {kept}")
          print(f"Removed: {removed}")
          PY

          rm source.txt

      - name: Commit filtered configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proxy_configs.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update filtered proxy configs"
            git push
          fi
